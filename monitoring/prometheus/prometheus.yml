global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'portfolio'

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  # ── Prometheus itself ─────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # ── Container metrics (cAdvisor) ──────────────
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
    metrics_path: /metrics

  # ── Nginx metrics ─────────────────────────────
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'

  # ── MySQL metrics ─────────────────────────────
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']
        labels:
          service: 'mysql'

  # ── Loki ─────────────────────────────────────
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'
    metrics_path: /metrics
