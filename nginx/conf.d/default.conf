# =============================================
# Nginx Virtual Host - Portfolio
# HTTP → HTTPS redirect + Main site
# =============================================

# Upstream PHP-FPM backend (qua HTTP wrapper nếu dùng gateway)
# Theo yêu cầu đề: Nginx → HTTP web → PHP-FPM (không proxy_pass trực tiếp tới FPM socket)
# Ở đây Nginx kết nối fastcgi qua port PHP-FPM (đúng chuẩn FastCGI, không phải HTTP proxy)
upstream php_fpm {
    server php:9000;
    keepalive 8;
}

# ──────────────────────────────────────────
# HTTP Server (port 80)
# ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Health check endpoint (không redirect)
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Nginx stub_status cho exporter
    location = /stub_status {
        stub_status;
        access_log off;
        allow 172.0.0.0/8;
        allow 10.0.0.0/8;
        deny all;
    }

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ──────────────────────────────────────────
# HTTPS Server (port 443)
# ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # SSL Self-signed
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none';" always;

    # Rate limiting
    limit_req zone=general burst=50 nodelay;

    # Chặn truy cập file nhạy cảm
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|git|sql|bak|log|ini|conf|cfg|sh)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Static assets caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        # Fallback về PHP nếu file không tìm thấy
        try_files $uri =404;
    }

    # Upload directory: chặn thực thi PHP
    location /uploads/ {
        alias /var/www/html/uploads/;
        location ~ \.php$ {
            deny all;
        }
        add_header X-Content-Type-Options "nosniff";
    }

    # Health check
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Stub status (chỉ cho mạng nội bộ)
    location = /stub_status {
        stub_status;
        access_log off;
        allow 172.0.0.0/8;
        allow 10.0.0.0/8;
        deny all;
    }

    # Login rate limit
    location = /admin/login {
        limit_req zone=login burst=5 nodelay;
        fastcgi_pass php_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 30s;
        fastcgi_buffers 8 16k;
        fastcgi_buffer_size 32k;
    }

    # Contact form rate limit (route thực tế: /lien-he/gui)
    location = /lien-he/gui {
        limit_req zone=contact burst=3 nodelay;
        fastcgi_pass php_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 30s;
    }

    # Tất cả request → PHP front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 30s;
        fastcgi_buffers 8 16k;
        fastcgi_buffer_size 32k;
        # Ẩn PHP error chi tiết
        fastcgi_intercept_errors on;
    }
}
