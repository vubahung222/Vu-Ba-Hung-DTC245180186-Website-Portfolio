; PHP-FPM Pool Configuration for Portfolio
[portfolio]
user = appuser
group = appgroup
listen = 0.0.0.0:9000
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Logging
access.log = /proc/self/fd/2
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

; Status page (for monitoring)
pm.status_path = /php-fpm-status
ping.path = /php-fpm-ping
ping.response = pong
