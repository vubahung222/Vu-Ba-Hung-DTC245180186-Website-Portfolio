# =============================================
# PORTFOLIO - DOCKER COMPOSE
# Đề 13: Website Portfolio / Giới thiệu Cá nhân
# =============================================

networks:
  frontend:
    name: portfolio_frontend
  backend:
    name: portfolio_backend
  monitoring:
    name: portfolio_monitoring

volumes:
  mysql_data:
    name: portfolio_mysql_data
  uploads_data:
    name: portfolio_uploads_data
  prometheus_data:
    name: portfolio_prometheus_data
  grafana_data:
    name: portfolio_grafana_data
  loki_data:
    name: portfolio_loki_data
  nginx_logs:
    name: portfolio_nginx_logs

services:
  # ──────────────────────────────────────────
  # DATABASE
  # ──────────────────────────────────────────
  mysql:
    image: mysql:8.0.36
    container_name: portfolio_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --bind-address=0.0.0.0
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  # ──────────────────────────────────────────
  # PHP-FPM APPLICATION
  # ──────────────────────────────────────────
  php:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: portfolio_php
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./app:/var/www/html:ro
      - uploads_data:/var/www/html/uploads:rw
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>/dev/null && echo ok"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ──────────────────────────────────────────
  # NGINX (GATEWAY + REVERSE PROXY)
  # ──────────────────────────────────────────
  nginx:
    image: nginx:1.25.4-alpine
    container_name: portfolio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./app/public:/var/www/html/public:ro
      - uploads_data:/var/www/html/uploads:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend
      - backend
      - monitoring
    depends_on:
      - php
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ──────────────────────────────────────────
  # PHPMYADMIN
  # ──────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    container_name: portfolio_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      PMA_ARBITRARY: ${PMA_ARBITRARY}
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # ──────────────────────────────────────────
  # PROMETHEUS
  # ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: portfolio_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────
  # GRAFANA
  # ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.3
    container_name: portfolio_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_LOG_LEVEL: warn
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────
  # LOKI (LOG AGGREGATION)
  # ──────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.4
    container_name: portfolio_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────
  # PROMTAIL (LOG SHIPPER)
  # ──────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.4
    container_name: portfolio_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true

  # ──────────────────────────────────────────
  # CADVISOR (Container metrics)
  # Ghi chú: Trên Docker Desktop/Windows, một số metrics cgroups bị giới hạn
  # ──────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: portfolio_cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ──────────────────────────────────────────
  # NGINX EXPORTER (Nginx metrics)
  # ──────────────────────────────────────────
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: portfolio_nginx_exporter
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx/stub_status"
    networks:
      - monitoring
      - frontend
    depends_on:
      - nginx
    security_opt:
      - no-new-privileges:true

  # ──────────────────────────────────────────
  # MYSQL EXPORTER (MySQL metrics)
  # ──────────────────────────────────────────
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: portfolio_mysql_exporter
    restart: unless-stopped
    command:
      - "--mysqld.address=mysql:3306"
      - "--mysqld.username=exporter"
      - "--config.my-cnf=/etc/mysql-exporter/.my.cnf"
    volumes:
      - ./monitoring/mysql-exporter.cnf:/etc/mysql-exporter/.my.cnf:ro
    networks:
      - monitoring
      - backend
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
